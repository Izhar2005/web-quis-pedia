<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pedia Quiz: Fakta Menarik Dunia</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <!-- Home Page -->
<section id="home-page" class="page active">
  <h1>Selamat Datang di Pedia Quiz</h1>
  <p>Uji pengetahuanmu tentang fakta menarik dunia dengan kuis seru ini!</p>

  <div id="difficulty-selector" class="difficulty-selector">
    <h3>Pilih Tingkat Pengetahuanmu:</h3>
    <div class="difficulty-options">
      <label class="difficulty-option" for="level-sd">
        <input type="radio" name="difficulty" id="level-sd" value="sd" />
        <div class="icon">📚</div>
        <div class="label-text">Tingkat SD</div>
      </label>
      <label class="difficulty-option" for="level-smp">
        <input type="radio" name="difficulty" id="level-smp" value="smp" />
        <div class="icon">🎒</div>
        <div class="label-text">Tingkat SMP</div>
      </label>
      <label class="difficulty-option" for="level-sma">
        <input type="radio" name="difficulty" id="level-sma" value="sma" />
        <div class="icon">🎓</div>
        <div class="label-text">Tingkat SMA</div>
      </label>
      <label class="difficulty-option" for="level-s1">
        <input type="radio" name="difficulty" id="level-s1" value="s1" />
        <div class="icon">🌍</div>
        <div class="label-text">Tingkat S-1</div>
      </label>
      <label class="difficulty-option" for="level-s2">
        <input type="radio" name="difficulty" id="level-s2" value="s2" />
        <div class="icon">📖</div>
        <div class="label-text">Tingkat S-2</div>
      </label>
    </div>
  </div>

  <button id="start-quiz-btn" class="btn" disabled>Mulai Kuis</button>
</section>

    <!-- Quiz Page -->
    <section id="quiz-page" class="page">
      <div class="quiz-header">
        <div id="question-number">Pertanyaan 1 dari 30</div>
        <div class="progress-bar">
          <div id="progress-fill"></div>
        </div>
      </div>
      <div id="question-card" class="card">
        <div id="question-text" class="question-text"></div>
        <div id="options" class="options">
          <!-- Options will be generated here -->
        </div>
      </div>
      <button id="next-btn" class="btn" disabled>Selanjutnya</button>
    </section>

    <!-- Result Page -->
    <section id="result-page" class="page">
      <h2>Hasil Kuis</h2>
      <p id="score-text"></p>
      <p id="feedback-text" class="feedback"></p>
      <button id="retry-btn" class="btn">Coba Lagi</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
